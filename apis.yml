name: HomeVision
description: 'HomeVision is an AI-powered collateral underwriting and appraisal quality-control
  platform for mortgage lenders and appraisal management companies (AMCs). Its MIRA platform pairs
  machine intelligence with human review to transform unstructured appraisal content — narrative
  commentary, sketches, photos and addenda — into structured, review-ready data using OCR, large
  language models, natural language processing and computer vision, and integrates with popular LOS
  and AMS platforms plus external data such as public records and MLS. Founded in 2019 and based in
  San Francisco, HomeVision is backed by Initialized Capital and Newark Venture Partners, and offers
  private API integration to customer order-management systems (no public developer portal).'
